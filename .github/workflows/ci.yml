name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log || {
            # Surface errors as annotations so they show on the PR / run page.
            grep -E "error|Error" typecheck.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: npm test
      - run: npm run build
